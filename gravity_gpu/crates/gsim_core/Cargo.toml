[package]
name = "gsim_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless GPU N-body simulation core: physics constants, seeded spawn, GPU compute driver, benchmarks"

[lib]
name = "gsim_core"
path = "src/lib.rs"

[dependencies]
wgpu = "30.0.1"
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

# Embedded DXC: windows/msvc builds statically link the DX12 shader
# compiler (wgpu's static-dxc feature), so DX12 runs can fall back to an
# internal DXC when no external dxcompiler.dll is found. Runtime
# selection lives in gpu/context.rs (external > embedded > FXC).
[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
wgpu = { version = "30.0.1", features = ["static-dxc"] }

[dev-dependencies]
proptest = "1.12"
