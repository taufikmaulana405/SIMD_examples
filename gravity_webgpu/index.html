<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gravity Simulation — WebGPU</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #010208; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 14px 18px auto; pointer-events: none; color: #dbe8ff;
      text-shadow: 0 1px 4px #000; font-size: 14px; line-height: 1.5; }
    #help { position: fixed; inset: auto 18px 14px; pointer-events: none; color: #9eafd0;
      text-shadow: 0 1px 4px #000; font-size: 13px; }
    #error { display: none; position: fixed; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
      max-width: 620px; padding: 22px 26px; border: 1px solid #ef6680; border-radius: 10px;
      background: #170b13; color: #ffdce3; box-shadow: 0 12px 40px #000; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">Memuat WebGPU…</div>
  <div id="help">Space: pause · R: reset · T: trails · ↑/↓: time scale · wheel: zoom</div>
  <div id="error"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
