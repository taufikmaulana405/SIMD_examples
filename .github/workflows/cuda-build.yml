name: Build gravity_cuda

on:
  push:
    branches: [main]
    paths:
      - 'gravity_cuda/**'
      - '.github/workflows/cuda-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gravity_cuda/**'
      - '.github/workflows/cuda-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }} x64 with CUDA ${{ matrix.cuda }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            cuda: '12.9.0'
            cuda-arch: compute_53
            cuda-packages: '["nvcc", "cudart"]'
          # Latest Windows CUDA version supported by cuda-toolkit v0.2.36.
          # Update this pin when the installer action adds newer releases.
          - os: windows-latest
            cuda: '13.5.0'
            cuda-arch: compute_83
            # CUDA 13 ships compiler components as separate subpackages.
            cuda-packages: '["nvcc", "cudart", "crt", "nvvm", "nvptxcompiler"]'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up MSVC tools for nvcc
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          sub-packages: ${{ matrix.cuda-packages }}
          log-file-suffix: ${{ matrix.os }}-cuda-${{ matrix.cuda }}.txt

      - name: Configure CUDA library path
        shell: pwsh
        run: |
          $cudaHostConfig = Join-Path $env:CUDA_PATH 'include/crt/host_config.h'
          if (!(Test-Path $cudaHostConfig)) {
            throw "CUDA compiler header was not found at $cudaHostConfig. Check the installed CUDA compiler subpackages."
          }
          $cudaLibraryPath = Join-Path $env:CUDA_PATH 'lib/x64'
          if (!(Test-Path (Join-Path $cudaLibraryPath 'cuda.lib'))) {
            throw "CUDA Driver API import library was not found in $cudaLibraryPath"
          }
          "CUDA_LIBRARY_PATH=$cudaLibraryPath" >> $env:GITHUB_ENV
          nvcc --version

      - name: Cache Cargo
        # Enabled by default; can be disabled via repository variable ENABLE_BUILD_CACHE=false
        if: vars.ENABLE_BUILD_CACHE != 'false'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gravity_cuda/target
          key: ${{ matrix.os }}-cargo-cuda-msvc-${{ matrix.cuda }}-${{ matrix.cuda-arch }}-${{ hashFiles('gravity_cuda/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-cuda-msvc-${{ matrix.cuda }}-${{ matrix.cuda-arch }}-

      - name: Build gravity_cuda
        working-directory: gravity_cuda
        env:
          CUDA_ARCH: ${{ matrix.cuda-arch }}
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Rename Windows binary
        shell: pwsh
        working-directory: gravity_cuda/target/x86_64-pc-windows-msvc/release
        run: Rename-Item -LiteralPath 'gravity_cuda.exe' -NewName 'gravity-cuda-${{ matrix.os }}-x64-cuda-${{ matrix.cuda }}.exe' -ErrorAction Stop

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: gravity-cuda-${{ matrix.os }}-x64-cuda-${{ matrix.cuda }}
          path: gravity_cuda/target/x86_64-pc-windows-msvc/release/gravity-cuda-${{ matrix.os }}-x64-cuda-${{ matrix.cuda }}.exe
          if-no-files-found: error
          archive: false
