name: Build gravity_scalar

on:
  push:
    branches: [main]
    paths:
      - 'gravity_scalar/**'
      - '.github/workflows/scalar-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'gravity_scalar/**'
      - '.github/workflows/scalar-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 binary
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        # Enabled by default; can be disabled via repository variable ENABLE_BUILD_CACHE=false
        if: vars.ENABLE_BUILD_CACHE != 'false'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gravity_scalar/target
          key: ${{ runner.os }}-cargo-scalar-${{ hashFiles('gravity_scalar/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-scalar-

      - name: Build gravity_scalar
        working-directory: gravity_scalar
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: gravity-scalar-windows-x64
          path: gravity_scalar/target/x86_64-pc-windows-msvc/release/gravity_scalar.exe
          if-no-files-found: error
          archive: false
